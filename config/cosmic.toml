# SoryOS - cosmic application set (pop-os upstream recipes)
# Used by .github/workflows/cosmic-release.yml to build only the cosmic
# applications and publish them as a GitHub Release (soryos-apt/releases).
# Dependencies are pulled automatically by `repo cook --with-package-deps`.

# General settings
[general]
# Filesystem size in MiB (repo build only packages, size is irrelevant here)
filesystem_size = 64

# Package settings
[packages]
cosmic-files = {}
cosmic-text = {}
cosmic-edit = {}
cosmic-reader = {}
cosmic-term = {}
cosmic-icons = {}
cosmic-applets = "source"
cosmic-applibrary = "source"
cosmic-bg = "source"
cosmic-comp = "source"
cosmic-greeter = "source"
cosmic-idle = "source"
cosmic-initial-setup = "source"
cosmic-launcher = "source"
cosmic-monitor = "source"
cosmic-notifications = "source"
cosmic-osd = "source"
cosmic-panel = "source"
cosmic-player = "source"
cosmic-randr = "source"
cosmic-screenshot = "source"
cosmic-session = "source"
cosmic-settings = "source"
cosmic-settings-daemon = "source"
cosmic-store = "source"
cosmic-sync = "source"
cosmic-workspaces = "source"
simple-wrapper = "source"
sory-desktop = "source"
soryos-launcher = "source"
xdg-desktop-portal-cosmic = "source"
pop-icon-theme = {}
