# SoryOS - cosmic application set (pop-os upstream recipes)
# Used by .github/workflows/cosmic-release.yml to build only the cosmic
# applications and publish them as a GitHub Release (soryos-apt/releases).
# Dependencies are pulled automatically by `repo cook --with-package-deps`.

# General settings
[general]
# Filesystem size in MiB (repo build only packages, size is irrelevant here)
filesystem_size = 64

# Package settings
[packages]
cosmic-files = {}
cosmic-text = {}
cosmic-edit = {}
cosmic-reader = {}
cosmic-term = {}
cosmic-icons = {}
cosmic-applets = { rule = "source" }
cosmic-applibrary = { rule = "source" }
cosmic-bg = { rule = "source" }
cosmic-comp = { rule = "source" }
cosmic-greeter = { rule = "source" }
cosmic-idle = { rule = "source" }
cosmic-initial-setup = { rule = "source" }
cosmic-launcher = { rule = "source" }
cosmic-monitor = { rule = "source" }
cosmic-notifications = { rule = "source" }
cosmic-osd = { rule = "source" }
cosmic-panel = { rule = "source" }
cosmic-player = { rule = "source" }
cosmic-randr = { rule = "source" }
cosmic-screenshot = { rule = "source" }
cosmic-session = { rule = "source" }
cosmic-settings = { rule = "source" }
cosmic-settings-daemon = { rule = "source" }
cosmic-store = { rule = "source" }
cosmic-sync = { rule = "source" }
cosmic-workspaces = { rule = "source" }
simple-wrapper = { rule = "source" }
sory-desktop = { rule = "source" }
soryos-launcher = { rule = "source" }
xdg-desktop-portal-cosmic = { rule = "source" }
pop-icon-theme = {}
