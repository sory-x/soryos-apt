name: Package Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Equivalent of the official redox base image dependencies, installed
      # directly on the runner (no Docker Hub pull flakiness).
      - name: Install recipe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream appstream-compose autoconf autoconf2.69 automake autopoint \
            bison bsdextrautils build-essential cmake curl dos2unix doxygen expect \
            file flex fuse3 g++ genisoimage git git-lfs gobject-introspection \
            gtk-doc-tools gtk-update-icon-cache help2man ipxe-qemu intltool \
            libaudiofile-dev libdbus-glib-1-dev-bin libfuse3-dev \
            libgdk-pixbuf2.0-bin libglib2.0-dev-bin libhtml-parser-perl \
            librsvg2-common libsdl1.2-dev libsdl2-ttf-dev lzip m4 make meson nano \
            nasm ninja-build patch patchelf perl pkg-config po4a protobuf-compiler \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 python3 python3-dev \
            python3-libxml2 python3-mako python3-venv python3-yaml rsync ruby scons \
            ssh texinfo unifdef unzip wget xdg-utils xfonts-utils xserver-xorg-dev \
            xutils-dev xxd zip zstd libc6-dev-i386 syslinux-utils

      - name: Install rustup (official redox CI recipe)
        run: |
          curl "https://sh.rustup.rs" -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Build pkgar repository
        env:
          SORYOS_PKGAR_SECRET_KEY: ${{ secrets.SORYOS_PKGAR_SECRET_KEY }}
          SORYOS_PKGAR_PUBLIC_KEY: ${{ secrets.SORYOS_PKGAR_PUBLIC_KEY }}
          # Signed SoryOS Release index: fetch unchanged base packages from the
          # Release and cook only the recipes missing from it (incremental).
          # Without SORYOS_RELEASE_INDEX_URL, `repo cook --repo-binary` panics:
          #   legacy external package repositories are disabled ...
          #   (see src/cook/fetch_repo.rs:322 on sory-x/Redox comment ba3955d).
          SORYOS_RELEASE_REPOSITORY: sory-x/soryos-apt
          SORYOS_RELEASE_INDEX_URL: https://github.com/sory-x/soryos-apt/releases/download/soryos-2026.08.07-desktop-full5/index.json
          SORYOS_RECIPES: all
          SORYOS_REPO_BINARY: '1'
        run: |
          chmod +x scripts/build-packages.sh
          SORYOS_PKGAR_OUTPUT="$PWD/repo-out" \
          ./scripts/build-packages.sh

      - name: Validate repository structure
        run: |
          set -euo pipefail
          TARGET="x86_64-unknown-redox"
          test -f "repo-out/$TARGET/repo.toml"
          test -f "repo-out/id_ed25519.pub.toml"
          test -n "$(ls "repo-out/$TARGET"/*.pkgar 2>/dev/null | head -1)"
          printf 'pkgar repository validated: %s packages\n' \
            "$(ls "repo-out/$TARGET"/*.pkgar 2>/dev/null | wc -l)"
