name: Package Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: redoxos/redox-base-x86_64:latest
      options: --cap-add SYS_ADMIN --device /dev/fuse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rustup (official redox CI recipe)
        run: |
          curl "https://sh.rustup.rs" -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Build pkgar repository
        run: |
          chmod +x scripts/build-packages.sh
          SORYOS_PKGAR_OUTPUT="$PWD/repo-out" \
          ./scripts/build-packages.sh

      - name: Validate repository structure
        run: |
          set -euo pipefail
          TARGET="x86_64-unknown-redox"
          test -f "repo-out/$TARGET/repo.toml"
          test -f "repo-out/id_ed25519.pub.toml"
          test -n "$(ls "repo-out/$TARGET"/*.pkgar 2>/dev/null | head -1)"
          printf 'pkgar repository validated: %s packages\n' \
            "$(ls "repo-out/$TARGET"/*.pkgar 2>/dev/null | wc -l)"
