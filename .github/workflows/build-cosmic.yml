# =============================================================================
# SoryOS - Build and publish the Redox application set as native .pkgar binaries
# =============================================================================
# Reproduces the `make repo` build of the redox cookbook in CI.
# Installs the recipe system dependencies (podman/redox-base-containerfile)
# directly on the runner instead of pulling the redoxos/redox-base-x86_64 image
# (avoiding Docker Hub pull flakiness), mirroring the redox-os/.gitlab-ci.yml
# recipe:
#   - rustup stable minimal
#   - make prefix    -> downloads prebuilt toolchain (.pkgar from static.redox-os.org)
#   - make repo      -> cooks config/soryos.toml -> repo/<target>/ + repo_builder
# Output format is IDENTICAL to https://static.redox-os.org/pkg :
#   repo/<target>/<pkg>.pkgar + <pkg>.toml + repo.toml
# Published on an immutable GitHub Release. Pages receives only the signed
# index and public keys through the dedicated Pages workflow.
# Triggers:
#   - Manual dispatch with an immutable Release tag
# =============================================================================

name: Build Redox PKGAR

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Recipes to build (space-separated, or "all")'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild all recipes'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Immutable GitHub Release tag, for example soryos-2026.08.1'
        required: true
      repo_binary:
        description: 'Use existing SoryOS pkgar packages (1) or rebuild recipes from source (0)'
        required: false
        default: '1'
      base_release_tag:
        description: 'Existing SoryOS Release used for the signed key and toolchain'
        required: false
        default: 'soryos-2026.08.07-desktop-full5'

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: "🔍 Detect changes"
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Detect version changes
        id: detect
        run: |
          cd soryos-apt
          python3 - <<'PY'
          import json
          import os

          requested = "${{ inputs.recipes }}".strip()
          manifest = json.load(open("redox-apps/manifest.json"))
          available = {r["name"] for r in manifest["recipes"]}
          if requested == "all":
              changed = sorted(available)
          else:
              changed = requested.split()
              unknown = sorted(set(changed) - available)
              if unknown:
                  raise SystemExit(f"Unknown recipe(s): {', '.join(unknown)}")
          if not changed:
              raise SystemExit("At least one recipe is required")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"recipes={' '.join(changed)}\n")
              out.write("has_changes=true\n")
          PY

  build:
    name: "🔨 Build pkgar repo"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      SORYOS_REDOX_REF: main
      SORYOS_TARGET: x86_64-unknown-redox
      SORYOS_PKGAR_OUTPUT: /home/runner/work/soryos-apt/soryos-apt/repo-out
      SORYOS_FILESYSTEM_CONFIG: config/soryos.toml
      SORYOS_RECIPES: ${{ inputs.recipes }}
      SORYOS_REPO_BINARY: ${{ inputs.repo_binary }}
      SORYOS_RELEASE_INDEX_URL: https://github.com/sory-x/soryos-apt/releases/download/${{ inputs.base_release_tag }}/index.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      # Equivalent of the official redox base image (podman/redox-base-containerfile),
      # installed directly on the runner to avoid Docker Hub pull flakiness.
      - name: Install recipe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream appstream-compose autoconf autoconf2.69 automake autopoint \
            bison bsdextrautils build-essential cmake curl dos2unix doxygen expect \
            file flex fuse3 g++ genisoimage git git-lfs gobject-introspection \
            gtk-doc-tools gtk-update-icon-cache help2man ipxe-qemu intltool \
            libaudiofile-dev libdbus-glib-1-dev-bin libfuse3-dev \
            libgdk-pixbuf2.0-bin libglib2.0-dev-bin libhtml-parser-perl \
            librsvg2-common libsdl1.2-dev libsdl2-ttf-dev lzip m4 make meson nano \
            nasm ninja-build patch patchelf perl pkg-config po4a protobuf-compiler \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 python3 python3-dev \
            python3-libxml2 python3-mako python3-venv python3-yaml rsync ruby scons \
            ssh texinfo unifdef unzip wget xdg-utils xfonts-utils xserver-xorg-dev \
            xutils-dev xxd zip zstd libc6-dev-i386 syslinux-utils b3sum openssl

      - name: Install rustup (official redox CI recipe)
        run: |
          curl "https://sh.rustup.rs" -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cargo --version

      - name: Build pkgar repository
        env:
          SORYOS_PKGAR_SECRET_KEY: ${{ secrets.SORYOS_PKGAR_SECRET_KEY }}
          SORYOS_PKGAR_PUBLIC_KEY: ${{ secrets.SORYOS_PKGAR_PUBLIC_KEY }}
          SORYOS_INDEX_PRIVATE_KEY_PEM: ${{ secrets.SORYOS_INDEX_PRIVATE_KEY_PEM }}
        run: |
          cd soryos-apt
          chmod +x scripts/build-packages.sh
          ./scripts/build-packages.sh

          test -n "$SORYOS_INDEX_PRIVATE_KEY_PEM" || {
            echo "Missing SORYOS_INDEX_PRIVATE_KEY_PEM GitHub secret" >&2
            exit 1
          }
          python3 scripts/generate-release-index.py \
            "$SORYOS_PKGAR_OUTPUT/$SORYOS_TARGET" \
            "${{ inputs.tag }}" \
            "sory-x/soryos-apt" \
            "$SORYOS_PKGAR_OUTPUT/index.json" \
            "https://github.com/sory-x/soryos-apt/releases/download/${{ inputs.tag }}" \
            "$SORYOS_PKGAR_OUTPUT/id_ed25519.pub.toml"
          umask 077
          printf '%s\n' "$SORYOS_INDEX_PRIVATE_KEY_PEM" > index-signing-key.pem
          scripts/sign-release-index.sh \
            "$SORYOS_PKGAR_OUTPUT/index.json" index-signing-key.pem
          openssl pkey -in index-signing-key.pem -pubout \
            -out "$SORYOS_PKGAR_OUTPUT/index-signing-key.pub.pem"
          openssl pkey -pubin -in "$SORYOS_PKGAR_OUTPUT/index-signing-key.pub.pem" \
            -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n' \
            > "$SORYOS_PKGAR_OUTPUT/index-signing-key.pub.hex"
          rm -f index-signing-key.pem

      - name: Upload pkgar repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgar-repo
          path: repo-out/*

  publish:
    name: "📤 Publish pkgar to immutable GitHub Release"
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download pkgar repository artifact
        uses: actions/download-artifact@v4
        with:
          path: repo-dl
          pattern: "pkgar-repo"
          merge-multiple: true

      - name: Ensure immutable Release tag is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.tag }}" --repo sory-x/soryos-apt >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite immutable artifacts" >&2
            exit 1
          fi

      - name: Upload complete pkgar repository to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" \
            --repo sory-x/soryos-apt \
            --title "SoryOS native pkgar (${{ inputs.tag }})" \
            --notes "Complete SoryOS Redox native package repository. Every .pkgar is signed with the stable PKGAR key. index.json is signed separately by the CI index key."

          # GitHub applies a secondary API limit when hundreds of assets are
          # uploaded concurrently. Upload deterministically and slowly, with
          # retries, while keeping every package as an individual Release asset.
          while IFS= read -r -d '' asset; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ inputs.tag }}" "$asset" --repo sory-x/soryos-apt; then
                uploaded=true
                break
              fi
              sleep $((attempt * 20))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Unable to upload Release asset: $asset" >&2
              exit 1
            fi
            sleep 1
          done < <(find repo-dl -type f -print0 | sort -z)
