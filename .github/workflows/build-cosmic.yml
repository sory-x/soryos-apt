# =============================================================================
# SoryOS - Build and publish the Redox application set as native .pkgar binaries
# =============================================================================
# Reproduces the `make repo` build of the redox cookbook in CI.
# Installs the recipe system dependencies (podman/redox-base-containerfile)
# directly on the runner instead of pulling the redoxos/redox-base-x86_64 image
# (avoiding Docker Hub pull flakiness), mirroring the redox-os/.gitlab-ci.yml
# recipe:
#   - rustup stable minimal
#   - make prefix    -> downloads prebuilt toolchain (.pkgar from static.redox-os.org)
#   - make repo      -> cooks config/soryos.toml -> repo/<target>/ + repo_builder
# Output format is IDENTICAL to https://static.redox-os.org/pkg :
#   repo/<target>/<pkg>.pkgar + <pkg>.toml + repo.toml
# Published on GitHub Pages so `redox_installer --cookbook=.` can consume it.
# Triggers:
#   - Manual dispatch (recipes / force_rebuild)
#   - Schedule (daily at 02:00 UTC)
# =============================================================================

name: Build Redox PKGAR

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Recipes to build (space-separated, or "all")'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild all recipes'
        required: false
        type: boolean
        default: false

  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: "🔍 Detect changes"
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Detect version changes
        id: detect
        run: |
          cd soryos-apt
          python3 - <<'PY'
          import json
          import os

          # List every recipe from the redox cookbook manifest.
          # The full set is rebuilt on each run, mirroring `make repo`.
          manifest = json.load(open("redox-apps/manifest.json"))
          changed = [r["name"] for r in manifest["recipes"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"recipes={' '.join(changed)}\n")
              out.write("has_changes=true\n")
          PY

  build:
    name: "🔨 Build pkgar repo"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      SORYOS_REDOX_REF: main
      SORYOS_TARGET: x86_64-unknown-redox
      SORYOS_PKGAR_OUTPUT: /home/runner/work/soryos-apt/soryos-apt/repo-out
      SORYOS_FILESYSTEM_CONFIG: config/soryos.toml
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      # Equivalent of the official redox base image (podman/redox-base-containerfile),
      # installed directly on the runner to avoid Docker Hub pull flakiness.
      - name: Install recipe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream appstream-compose autoconf autoconf2.69 automake autopoint \
            bison bsdextrautils build-essential cmake curl dos2unix doxygen expect \
            file flex fuse3 g++ genisoimage git git-lfs gobject-introspection \
            gtk-doc-tools gtk-update-icon-cache help2man ipxe-qemu intltool \
            libaudiofile-dev libdbus-glib-1-dev-bin libfuse3-dev \
            libgdk-pixbuf2.0-bin libglib2.0-dev-bin libhtml-parser-perl \
            librsvg2-common libsdl1.2-dev libsdl2-ttf-dev lzip m4 make meson nano \
            nasm ninja-build patch patchelf perl pkg-config po4a protobuf-compiler \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 python3 python3-dev \
            python3-libxml2 python3-mako python3-venv python3-yaml rsync ruby scons \
            ssh texinfo unifdef unzip wget xdg-utils xfonts-utils xserver-xorg-dev \
            xutils-dev xxd zip zstd libc6-dev-i386 syslinux-utils

      - name: Install rustup (official redox CI recipe)
        run: |
          curl "https://sh.rustup.rs" -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cargo --version

      - name: Build pkgar repository
        env:
          SORYOS_PKGAR_SECRET_KEY: ${{ secrets.SORYOS_PKGAR_SECRET_KEY }}
          SORYOS_PKGAR_PUBLIC_KEY: ${{ secrets.SORYOS_PKGAR_PUBLIC_KEY }}
        run: |
          cd soryos-apt
          chmod +x scripts/build-packages.sh
          ./scripts/build-packages.sh

      - name: Upload pkgar repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgar-repo
          path: repo-out/*

  publish:
    name: "📤 Publish pkgar to GitHub Pages"
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download pkgar repository artifact
        uses: actions/download-artifact@v4
        with:
          path: repo-dl
          pattern: "pkgar-repo"
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo-dl

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
