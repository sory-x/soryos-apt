# =============================================================================
# SoryOS - Incremental in-place Release update
# =============================================================================
# Rebuilds ONLY the changed recipes from source, then updates an EXISTING
# immutable Release in place:
#   - validates the current signed index
#   - merges the newly built .pkgar/.toml into the index
#   - re-signs index.json with the CI index key
#   - replaces only the changed assets + index in the Release
# Unchanged packages are never recompiled nor re-published.
# =============================================================================

name: Update Redox PKGAR (incremental)

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Changed recipes to rebuild from source (space-separated)'
        required: true
      release_tag:
        description: 'Existing SoryOS Release to update in place'
        required: false
        default: 'soryos-2026.08.07-desktop-full5'

concurrency:
  group: update-release-soryos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: "🔨 Rebuild changed recipes + sign index"
    runs-on: ubuntu-latest
    env:
      SORYOS_REDOX_REF: main
      SORYOS_TARGET: x86_64-unknown-redox
      SORYOS_PKGAR_OUTPUT: ${{ github.workspace }}/repo-out
      SORYOS_RECIPES: ${{ inputs.recipes }}
      SORYOS_RELEASE_INDEX_URL: https://github.com/sory-x/soryos-apt/releases/download/${{ inputs.release_tag }}/index.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Restore incremental recipe build cache
        uses: actions/cache@v4
        with:
          path: |
            soryos-apt/tmp/build-*/redox/recipes/**/target
            soryos-apt/tmp/build-*/redox/build/logs
          key: pkgar-update-${{ runner.os }}-${{ inputs.recipes }}
          restore-keys: |
            pkgar-update-${{ runner.os }}-

      - name: Install recipe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream appstream-compose autoconf autoconf2.69 automake autopoint \
            bison bsdextrautils build-essential cmake curl dos2unix doxygen expect \
            file flex fuse3 g++ genisoimage git git-lfs gobject-introspection \
            gtk-doc-tools gtk-update-icon-cache help2man ipxe-qemu intltool \
            libaudiofile-dev libdbus-glib-1-dev-bin libfuse3-dev \
            libgdk-pixbuf2.0-bin libglib2.0-dev-bin libhtml-parser-perl \
            librsvg2-common libsdl1.2-dev libsdl2-ttf-dev lzip m4 make meson nano \
            nasm ninja-build patch patchelf perl pkg-config po4a protobuf-compiler \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 python3 python3-dev \
            python3-libxml2 python3-mako python3-venv python3-yaml rsync ruby scons \
            ssh texinfo unifdef unzip wget xdg-utils xfonts-utils xserver-xorg-dev \
            xutils-dev xxd zip zstd libc6-dev-i386 syslinux-utils b3sum openssl

      - name: Install rustup (official redox CI recipe)
        run: |
          curl "https://sh.rustup.rs" -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cargo --version

      - name: Install host build tools required by relibc
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cbindgen --locked --version 0.28.0
          cbindgen --version

      - name: Install current Meson for GLib recipes
        run: |
          python3 -m pip install --user --break-system-packages 'meson>=1.4.0,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Rebuild changed recipes only
        env:
          SORYOS_PKGAR_SECRET_KEY: ${{ secrets.SORYOS_PKGAR_SECRET_KEY }}
          SORYOS_PKGAR_PUBLIC_KEY: ${{ secrets.SORYOS_PKGAR_PUBLIC_KEY }}
        run: |
          cd soryos-apt
          chmod +x scripts/build-update-packages.sh
          ./scripts/build-update-packages.sh

      - name: Validate current Release index signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd soryos-apt
          mkdir -p /tmp/release
          gh release view "${{ inputs.release_tag }}" --repo sory-x/soryos-apt >/dev/null
          gh release download "${{ inputs.release_tag }}" --repo sory-x/soryos-apt \
            --pattern index.json --pattern index.json.sig --pattern index-signing-key.pub.pem \
            --dir /tmp/release --clobber
          openssl pkeyutl -verify -rawin -pubin \
            -inkey /tmp/release/index-signing-key.pub.pem \
            -in /tmp/release/index.json -sigfile /tmp/release/index.json.sig

      - name: Merge changed packages and re-sign index
        env:
          SORYOS_INDEX_PRIVATE_KEY_PEM: ${{ secrets.SORYOS_INDEX_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          cd soryos-apt
          test -n "$SORYOS_INDEX_PRIVATE_KEY_PEM" || {
            echo "Missing SORYOS_INDEX_PRIVATE_KEY_PEM GitHub secret" >&2
            exit 1
          }
          python3 scripts/update-release-index.py \
            /tmp/release/index.json \
            "$SORYOS_PKGAR_OUTPUT/$SORYOS_TARGET" \
            /tmp/release/index.new.json \
            "${{ inputs.release_tag }}"
          umask 077
          printf '%s\n' "$SORYOS_INDEX_PRIVATE_KEY_PEM" > index-signing-key.pem
          scripts/sign-release-index.sh /tmp/release/index.new.json index-signing-key.pem
          rm -f index-signing-key.pem
          cp /tmp/release/index.new.json "$SORYOS_PKGAR_OUTPUT/index.json"
          cp /tmp/release/index.new.json.sig "$SORYOS_PKGAR_OUTPUT/index.json.sig"

      - name: Upload changed pkgar + signed index artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgar-update
          path: repo-out/*

  update-release:
    name: "📤 Update Release in place"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SORYOS_TARGET: x86_64-unknown-redox
    steps:
      - name: Download pkgar update artifact
        uses: actions/download-artifact@v4
        with:
          path: repo-dl
          pattern: "pkgar-update"
          merge-multiple: true

      - name: Replace changed package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="sory-x/soryos-apt"
          gh release view "$TAG" --repo "$REPO" >/dev/null || {
            echo "Release $TAG not found; refusing to modify" >&2
            exit 1
          }
          PACKAGE_DIR="repo-dl/$SORYOS_TARGET"
          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "no changed packages under $PACKAGE_DIR" >&2
            exit 1
          fi
          for pkgar in "$PACKAGE_DIR"/*.pkgar; do
            base=$(basename "$pkgar")
            toml="${base%.pkgar}.toml"
            printf 'updating package %s\n' "$base"
            gh release delete-asset "$TAG" "$base" --repo "$REPO" --yes
            gh release upload "$TAG" "$pkgar" --repo "$REPO"
            if [[ -f "$PACKAGE_DIR/$toml" ]]; then
              gh release delete-asset "$TAG" "$toml" --repo "$REPO" --yes
              gh release upload "$TAG" "$PACKAGE_DIR/$toml" --repo "$REPO"
            fi
          done

      - name: Replace signed index last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="sory-x/soryos-apt"
          gh release delete-asset "$TAG" index.json --repo "$REPO" --yes
          gh release delete-asset "$TAG" index.json.sig --repo "$REPO" --yes
          gh release upload "$TAG" repo-dl/index.json.sig --repo "$REPO"
          gh release upload "$TAG" repo-dl/index.json --repo "$REPO"

      - name: Verify updated Release index signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="sory-x/soryos-apt"
          gh release download "$TAG" --repo "$REPO" \
            --pattern index.json --pattern index.json.sig --pattern index-signing-key.pub.pem \
            --dir /tmp/verify --clobber
          openssl pkeyutl -verify -rawin -pubin \
            -inkey /tmp/verify/index-signing-key.pub.pem \
            -in /tmp/verify/index.json -sigfile /tmp/verify/index.json.sig
